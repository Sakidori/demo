				PresentationPlayer.start(presInfo, "content", "playerView", "promoLink", onPlayerInit, savedPresentationState);
				function onPlayerInit(player)
				{
					window.controlledPresentationPlayer = player;
					applyControlledPresentationState();
					document.documentElement.classList.add("fullscreen-presentation");

					var preloader = document.getElementById("preloader");
					preloader.parentNode.removeChild(preloader);

					function fitPresentationToViewport()
					{
						var playerView = document.getElementById("playerView");
						if (!playerView || !playerView.offsetWidth || !playerView.offsetHeight)
						{
							window.setTimeout(fitPresentationToViewport, 50);
							return;
						}

						var width = playerView.offsetWidth;
						var height = playerView.offsetHeight;
						var scale = Math.max(window.innerWidth / width, window.innerHeight / height);
						var fitStyle = document.getElementById("presentation-fit-style");
						if (!fitStyle)
						{
							fitStyle = document.createElement("style");
							fitStyle.id = "presentation-fit-style";
							document.head.appendChild(fitStyle);
						}
						fitStyle.textContent = "html.fullscreen-presentation #content #playerView {" +
							"transform-origin: 0 0 !important;" +
							"transform: scale(" + scale + ") !important;" +
							"left: " + (window.innerWidth - width * scale) / 2 + "px !important;" +
							"top: " + (window.innerHeight - height * scale) / 2 + "px !important;}";
					}

					window.setTimeout(fitPresentationToViewport, 0);
					window.addEventListener("resize", fitPresentationToViewport);
				}
			}

			if (startup)
				startup(start);
			else
				start();
		})());
