<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Game Host - Quiz Master</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-1: #f4fbff;
            --bg-2: #eef7ff;
            --panel: rgba(255,255,255,0.72);
            --panel-strong: rgba(255,255,255,0.9);
            --primary: #6d5efc;
            --primary-dark: #5347d8;
            --success: #2ec27e;
            --danger: #f05d5e;
            --warning: #f7b955;
            --text: #1d2a39;
            --muted: #5b6f82;
            --shadow: 0 24px 50px rgba(70, 90, 120, 0.18);
        }

        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, var(--bg-1), var(--bg-2) 50%, #edf1f9);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        .screen {
            display: none;
            width: min(760px, 100%);
            background: var(--panel);
            border: 1px solid rgba(255,255,255,0.7);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 28px;
            box-shadow: var(--shadow);
            padding: 28px 20px 30px;
            animation: fadeInUp 0.45s ease;
        }

        .active { display: block; }

        h1, h2, h3 {
            margin-top: 0;
        }

        h1 {
            font-size: clamp(2.2rem, 5vw, 3rem);
            margin-bottom: 18px;
        }

        h2 {
            color: var(--text);
            margin-bottom: 10px;
        }

        #qrcode {
            margin: 18px auto 24px;
            display: inline-block;
            background: rgba(255,255,255,0.85);
            padding: 14px;
            border-radius: 20px;
            box-shadow: 0 16px 28px rgba(109,94,252,0.15);
            animation: float 3s ease-in-out infinite;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 10px 0 0;
        }

        li {
            font-size: 18px;
            background: rgba(255,255,255,0.76);
            color: var(--text);
            padding: 12px 18px;
            width: min(360px, 85%);
            margin: 8px auto;
            border-radius: 14px;
            box-shadow: 0 10px 20px rgba(39, 55, 77, 0.08);
            border: 1px solid rgba(104, 131, 162, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            animation: slideIn 0.25s ease both;
        }

        li:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 22px rgba(39, 55, 77, 0.12);
        }

        button {
            font-size: 20px;
            padding: 14px 26px;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            margin-top: 18px;
            background: linear-gradient(135deg, var(--success), #1dbf73);
            color: white;
            box-shadow: 0 18px 32px rgba(46, 194, 126, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 22px 30px rgba(46, 194, 126, 0.32);
            filter: brightness(1.04);
        }

        #action-btn {
            background: linear-gradient(135deg, var(--danger), #d84343);
            box-shadow: 0 18px 28px rgba(240,93,94,0.28);
        }

        .leaderboard-item {
            font-size: 22px;
            font-weight: bold;
            background: linear-gradient(135deg, #ffd86b, #ffbf47);
            color: #3d2b00;
            border: none;
        }

        #timer {
            color: var(--primary-dark);
            font-weight: 700;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-8px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @media (max-width: 600px) {
            body { padding: 20px 12px; }
            .screen { padding: 22px 14px 24px; border-radius: 18px; }
            li { width: 92%; }
            button { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- LOBBY SCREEN -->
    <div id="lobby-screen" class="screen active">
        <h1>Scan to Join Game!</h1>
        <div id="qrcode"></div>
        <h2>Players in Lobby:</h2>
        <ul id="player-list"></ul>
        <br>
        <button id="start-btn" style="display:none;" onclick="startNextRound()">Start Game (Round 1)</button>
    </div>

    <!-- QUESTION SCREEN -->
    <div id="question-screen" class="screen">
        <h2 id="round-indicator">Round 1 / 3</h2>
        <h1 id="q-text">Loading question...</h1>
        <h3>Time Remaining: <span id="timer">120</span>s</h3>
        
        <h2>Live Player Status:</h2>
        <ul id="live-player-list"></ul>
        
        <br>
        <button id="action-btn" onclick="endCurrentRound()" style="background: #dc3545;">End Round Early</button>
    </div>

    <!-- LEADERBOARD SCREEN -->
    <div id="leaderboard-screen" class="screen">
        <h1>🏆 Final Leaderboard 🏆</h1>
        <ul id="final-leaderboard-list"></ul>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, remove, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // TODO: Replace with your actual Firebase config from Step 1
        const firebaseConfig = {
            apiKey: "AIzaSyDRg8ZJ4eFlHsbU-mvZGkeET49WZjbW4JQ",
            authDomain: "demogame-e8627.firebaseapp.com",
            databaseURL: "https://demogame-e8627-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "demogame-e8627",
            storageBucket: "demogame-e8627.firebasestorage.app",
            messagingSenderId: "251212598778",
            appId: "1:251212598778:web:8e12a0d06b6191fe6ae843"
        };

               const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // QR code points directly to the player page without any room codes.
        // Use a relative URL so it also works when opened via file:// during local testing.
        const playerUrl = new URL("player.html", window.location.href).href;
        new QRCode(document.getElementById("qrcode"), playerUrl);

        const questions = [
            { text: "What is 2 + 2?", answer: "4" },
            { text: "What color is a clear daytime sky?", answer: "blue" },
            { text: "What is the capital of France?", answer: "paris" }
        ];

        let currentRoundIndex = 0;
        let countdownInterval;

        // Global game database reference
        const gameRef = ref(db, `game`);
        
        // Reset/Initialize game state on load
        set(gameRef, {
            status: "waiting",
            round: 0,
            question: questions[0],
            players: {}
        });

        // Listen for players joining/updating
        const playersRef = ref(db, `game/players`);
        onValue(playersRef, (snapshot) => {
            const data = snapshot.val();
            const listEl = document.getElementById("player-list");
            const liveListEl = document.getElementById("live-player-list");
            listEl.innerHTML = "";
            liveListEl.innerHTML = "";
            
            if (data) {
                const players = Object.entries(data);
                players.forEach(([id, p]) => {
                    const li = document.createElement("li");
                    li.innerText = p.name;
                    listEl.appendChild(li);

                    const liveLi = document.createElement("li");
                    liveLi.innerText = `${p.name}: ${p.answered ? "✅ Answered" : "⏳ Thinking..."} (Total Score: ${p.score || 0})`;
                    liveListEl.appendChild(liveLi);
                });
                if (currentRoundIndex === 0) {
                    document.getElementById("start-btn").style.display = "inline-block";
                }
            }
        });

        window.startNextRound = function() {
            if (currentRoundIndex >= questions.length) {
                showLeaderboard();
                return;
            }

            get(playersRef).then((snapshot) => {
                if (snapshot.exists()) {
                    const updates = {};
                    snapshot.forEach((childSnap) => {
                        updates[`${childSnap.key}/answered`] = false;
                    });
                    update(playersRef, updates);
                }
            });

            document.getElementById("lobby-screen").classList.remove("active");
            document.getElementById("leaderboard-screen").classList.remove("active");
            document.getElementById("question-screen").classList.add("active");
            document.getElementById("round-indicator").innerText = `Round ${currentRoundIndex + 1} / 3`;
            document.getElementById("q-text").innerText = questions[currentRoundIndex].text;
            document.getElementById("action-btn").innerText = "End Round Early";
            document.getElementById("action-btn").onclick = endCurrentRound;

            update(gameRef, {
                status: `round-${currentRoundIndex}`,
                round: currentRoundIndex,
                question: questions[currentRoundIndex],
                startTime: Date.now()
            });

            let timeLeft = 120;
            const timerEl = document.getElementById("timer");
            timerEl.innerText = timeLeft;
            clearInterval(countdownInterval);

            countdownInterval = setInterval(() => {
                timeLeft--;
                timerEl.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    endCurrentRound();
                }
            }, 1000);
        };

        window.endCurrentRound = function() {
            clearInterval(countdownInterval);
            update(gameRef, { status: `round-${currentRoundIndex}-over` });

            currentRoundIndex++;

            const actionBtn = document.getElementById("action-btn");
            if (currentRoundIndex < questions.length) {
                actionBtn.innerText = `Start Round ${currentRoundIndex + 1}`;
                actionBtn.onclick = startNextRound;
            } else {
                actionBtn.innerText = "Show Final Leaderboard 🏆";
                actionBtn.onclick = showLeaderboard;
            }
        };

        function showLeaderboard() {
            clearInterval(countdownInterval);
            document.getElementById("question-screen").classList.remove("active");
            document.getElementById("leaderboard-screen").classList.add("active");

            update(gameRef, { status: "leaderboard-reveal" });

            get(playersRef).then((snapshot) => {
                const data = snapshot.val();
                const lbList = document.getElementById("final-leaderboard-list");
                lbList.innerHTML = "";

                if (data) {
                    const sortedPlayers = Object.values(data).sort((a, b) => (b.score || 0) - (a.score || 0));
                    
                    sortedPlayers.forEach((p, index) => {
                        const li = document.createElement("li");
                        li.className = "leaderboard-item";
                        li.innerHTML = `#${index + 1}: ${p.name} — ${p.score || 0} pts`;
                        lbList.appendChild(li);
                    });
                }
            });
        }
    </script>
</body>
</html>
