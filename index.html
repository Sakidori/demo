<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Game Host - Quiz Master</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 30px; }
        .screen { display: none; }
        .active { display: block; }
        #qrcode { margin: 20px auto; display: inline-block; }
        ul { list-style: none; padding: 0; }
        li { font-size: 18px; margin: 5px 0; }
        button { font-size: 20px; padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- LOBBY SCREEN -->
    <div id="lobby-screen" class="screen active">
        <h1 id="room-title">Loading Room...</h1>
        <div id="qrcode"></div>
        <h2>Players in Lobby:</h2>
        <ul id="player-list"></ul>
        <br>
        <button id="start-btn" style="display:none;" onclick="startGame()">Start Game</button>
    </div>

    <!-- HOST QUESTION SCREEN -->
    <div id="question-screen" class="screen">
        <h1 id="q-title">Question 1</h1>
        <h2 id="q-text">What is 2 + 2? (Answer: 4)</h2>
        <h3>Time Remaining: <span id="timer">120</span>s</h3>
        
        <h2>Live Player Status:</h2>
        <ul id="live-player-list"></ul>
        
        <br>
        <button id="reveal-btn" onclick="revealAnswer()" style="display:none; background: #dc3545;">Reveal Answer / End Round</button>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // TODO: Replace with your actual Firebase config from Step 1
        const firebaseConfig = {
            apiKey: "AIzaSyDRg8ZJ4eFlHsbU-mvZGkeET49WZjbW4JQ",
            authDomain: "demogame-e8627.firebaseapp.com",
            databaseURL: "https://demogame-e8627-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "demogame-e8627",
            storageBucket: "demogame-e8627.firebasestorage.app",
            messagingSenderId: "251212598778",
            appId: "1:251212598778:web:8e12a0d06b6191fe6ae843"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const roomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
        document.getElementById("room-title").innerText = `Room Code: ${roomCode}`;

        const playerUrl = `${window.location.origin}/player.html?room=${roomCode}`;
        new QRCode(document.getElementById("qrcode"), playerUrl);

        // Initialize Room
        const roomRef = ref(db, `rooms/${roomCode}`);
        set(roomRef, {
            status: "waiting",
            question: {
                text: "What is 2 + 2?",
                answer: "4"
            }
        });

        // Listen for players joining lobby
        const playersRef = ref(db, `rooms/${roomCode}/players`);
        onValue(playersRef, (snapshot) => {
            const data = snapshot.val();
            const listEl = document.getElementById("player-list");
            const liveListEl = document.getElementById("live-player-list");
            listEl.innerHTML = "";
            liveListEl.innerHTML = "";
            
            if (data) {
                const players = Object.entries(data);
                players.forEach(([id, p]) => {
                    // Lobby list
                    const li = document.createElement("li");
                    li.innerText = p.name;
                    listEl.appendChild(li);

                    // Live Question tracking list
                    const liveLi = document.createElement("li");
                    liveLi.innerText = `${p.name}: ${p.answered ? "✅ Answered" : "⏳ Thinking..."} (Score: ${p.score || 0})`;
                    liveListEl.appendChild(liveLi);
                });
                document.getElementById("start-btn").style.display = "inline-block";
            }
        });

        let countdownInterval;

        window.startGame = function() {
            // Switch views on host
            document.getElementById("lobby-screen").classList.remove("active");
            document.getElementById("question-screen").classList.add("active");
            document.getElementById("reveal-btn").style.display = "inline-block";

            // Update Firebase status to start game for players
            update(roomRef, { status: "question-1", startTime: Date.now() });

            // Start Host 2-minute timer
            let timeLeft = 120;
            const timerEl = document.getElementById("timer");
            countdownInterval = setInterval(() => {
                timeLeft--;
                timerEl.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    revealAnswer();
                }
            }, 1000);
        };

        window.revealAnswer = function() {
            clearInterval(countdownInterval);
            update(roomRef, { status: "round-over" });
            alert("Round ended! Host can now review scores.");
        };
    </script>
</body>
</html>
