<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Game Host - Quiz Master</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-1: #f4fbff;
            --bg-2: #eef7ff;
            --bg-3: #edf2ff;
            --panel: rgba(255,255,255,0.74);
            --panel-strong: rgba(255,255,255,0.9);
            --primary: #6d5efc;
            --primary-dark: #5347d8;
            --success: #2ec27e;
            --danger: #f05d5e;
            --warning: #f7b955;
            --text: #1d2a39;
            --muted: #5b6f82;
            --shadow: 0 28px 60px rgba(67, 85, 110, 0.18);
            --glow: rgba(109, 94, 252, 0.24);
        }

        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(109,94,252,0.18), transparent 28%),
                radial-gradient(circle at top right, rgba(46,194,126,0.15), transparent 28%),
                linear-gradient(135deg, var(--bg-1), var(--bg-2) 45%, var(--bg-3));
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            overflow-x: hidden;
            position: relative;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.32;
            z-index: 0;
            pointer-events: none;
        }

        body::before {
            background: rgba(109,94,252,0.22);
            top: -90px;
            left: -80px;
        }

        body::after {
            background: rgba(46,194,126,0.18);
            right: -80px;
            bottom: 0;
        }

        .screen {
            display: none;
            width: min(760px, 100%);
            background: linear-gradient(180deg, rgba(255,255,255,0.78), rgba(255,255,255,0.62));
            border: 1px solid rgba(255,255,255,0.75);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 30px;
            box-shadow: var(--shadow);
            padding: 28px 20px 30px;
            animation: fadeInUp 0.45s ease;
            position: relative;
            z-index: 1;
        }

        .active { display: block; }

        h1, h2, h3 {
            margin-top: 0;
        }

        h1 {
            font-size: clamp(2.2rem, 5vw, 3rem);
            margin-bottom: 18px;
            letter-spacing: -0.04em;
        }

        h2 {
            color: var(--text);
            margin-bottom: 10px;
        }

        #qrcode {
            margin: 22px auto 24px;
            display: inline-block;
            background: rgba(255,255,255,0.9);
            padding: 14px;
            border-radius: 22px;
            box-shadow: 0 25px 40px rgba(109,94,252,0.18), inset 0 0 0 1px rgba(109,94,252,0.09);
            animation: float 3s ease-in-out infinite;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 10px 0 0;
        }

        li {
            font-size: 18px;
            background: rgba(255,255,255,0.76);
            color: var(--text);
            padding: 12px 18px;
            width: min(360px, 85%);
            margin: 8px auto;
            border-radius: 14px;
            box-shadow: 0 10px 20px rgba(39, 55, 77, 0.08);
            border: 1px solid rgba(104, 131, 162, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            animation: slideIn 0.25s ease both;
            border-left: 4px solid var(--primary);
        }

        li:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 22px rgba(39, 55, 77, 0.12);
        }

        button {
            font-size: 20px;
            padding: 14px 26px;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            margin-top: 18px;
            background: linear-gradient(135deg, var(--success), #1dbf73);
            color: white;
            box-shadow: 0 18px 32px rgba(46, 194, 126, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
            letter-spacing: 0.01em;
            position: relative;
            overflow: hidden;
        }

        button::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.38) 45%, transparent 100%);
            transform: translateX(-120%);
            transition: transform 0.7s ease;
        }

        button:hover::after {
            transform: translateX(120%);
        }

        button:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 22px 30px rgba(46, 194, 126, 0.32);
            filter: brightness(1.04);
        }

        #action-btn {
            background: linear-gradient(135deg, var(--danger), #d84343);
            box-shadow: 0 18px 28px rgba(240,93,94,0.28);
        }

        .question-stage {
            background: linear-gradient(135deg, rgba(109,94,252,0.08), rgba(46,194,126,0.08));
            border: 1px solid rgba(109,94,252,0.14);
            border-radius: 22px;
            padding: 16px 18px 10px;
            margin: 18px auto 12px;
            width: min(580px, 92%);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.4);
        }

        .round-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(109,94,252,0.12);
            border: 1px solid rgba(109,94,252,0.18);
            color: var(--primary-dark);
            text-transform: uppercase;
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            font-weight: 800;
        }

        .timer-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 110px;
            padding: 8px 16px;
            border-radius: 999px;
            background: rgba(46,194,126,0.12);
            border: 1px solid rgba(46,194,126,0.18);
            color: #157a51;
            font-weight: 800;
            box-shadow: inset 0 0 20px rgba(46,194,126,0.05);
        }

        .results-badge {
            display: inline-block;
            padding: 8px 18px;
            background: linear-gradient(135deg, rgba(109,94,252,0.14), rgba(46,194,126,0.14));
            border: 1px solid rgba(109,94,252,0.2);
            color: var(--primary-dark);
            border-radius: 999px;
            font-weight: 700;
            margin-bottom: 10px;
            animation: pulse 1.8s infinite;
        }

        #round-results-list {
            margin-top: 18px;
        }

        .result-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: min(500px, 92%);
            padding: 14px 18px;
            font-size: 18px;
            background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(244,250,255,0.85));
            border-radius: 16px;
            margin: 10px auto;
            box-shadow: 0 12px 18px rgba(52,70,93,0.08);
            border-left: 4px solid rgba(109,94,252,0.75);
        }

        .result-item strong {
            color: var(--success);
        }

        .result-item.top-score {
            background: linear-gradient(135deg, #fff7d5, #ffe7a3);
            border: 1px solid rgba(247,185,85,0.25);
            border-left: 4px solid #f7b955;
        }

        .leaderboard-item {
            font-size: 22px;
            font-weight: bold;
            background: linear-gradient(135deg, #ffd86b, #ffbf47);
            color: #3d2b00;
            border: none;
            border-left: none;
            box-shadow: 0 14px 22px rgba(255,191,71,0.18);
            animation: riseIn 0.55s ease both;
        }

        #confetti-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        .podium {
            display: grid;
            grid-template-columns: repeat(3, minmax(120px, 1fr));
            gap: 14px;
            width: min(520px, 100%);
            margin: 20px auto 8px;
            align-items: end;
        }

        .podium-item {
            background: rgba(255,255,255,0.9);
            border-radius: 20px 20px 14px 14px;
            padding: 12px 8px 10px;
            box-shadow: 0 16px 26px rgba(66,84,120,0.12);
            animation: riseIn 0.6s ease both;
        }

        .podium-item.rank-1 {
            background: linear-gradient(180deg, #ffe88d, #ffc94d);
            height: 160px;
        }

        .podium-item.rank-2 {
            background: linear-gradient(180deg, #eaf1ff, #d4e2ff);
            height: 130px;
        }

        .podium-item.rank-3 {
            background: linear-gradient(180deg, #ffe1d3, #ffc4a5);
            height: 110px;
        }

        .podium-rank {
            font-size: 1.7rem;
            font-weight: 800;
        }

        .podium-name {
            font-weight: 700;
            margin: 6px 0 2px;
        }

        .podium-score {
            font-size: 0.95rem;
            color: var(--muted);
        }

        #timer {
            color: var(--primary-dark);
            font-weight: 700;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-8px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.04); opacity: 0.88; }
        }

        @keyframes riseIn {
            from { opacity: 0; transform: translateY(18px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (max-width: 600px) {
            body { padding: 20px 12px; }
            .screen { padding: 22px 14px 24px; border-radius: 18px; }
            li { width: 92%; }
            .result-item { width: 92%; }
            .podium { grid-template-columns: repeat(3, minmax(90px, 1fr)); }
            button { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- LOBBY SCREEN -->
    <div id="lobby-screen" class="screen active">
        <h1>Scan to Join Game!</h1>
        <div id="qrcode"></div>
        <h2>Players in Lobby:</h2>
        <ul id="player-list"></ul>
        <br>
        <button id="start-btn" style="display:none;" onclick="startNextRound()">Start Game (Round 1)</button>
    </div>

    <!-- QUESTION SCREEN -->
    <div id="question-screen" class="screen">
        <h2 id="round-indicator">Round 1 / 3</h2>
        <h1 id="q-text">Loading question...</h1>
        <h3>Time Remaining: <span id="timer">120</span>s</h3>
        
        <h2>Live Player Status:</h2>
        <ul id="live-player-list"></ul>
        
        <br>
        <button id="action-btn" onclick="endCurrentRound()" style="background: #dc3545;">End Round Early</button>
    </div>

    <!-- ROUND RESULTS SCREEN -->
    <div id="results-screen" class="screen">
        <h2 id="round-results-title">Round Results</h2>
        <div class="results-badge">Points revealed</div>
        <ul id="round-results-list"></ul>
        <button id="results-next-btn" onclick="advanceFromResults()">Next Round</button>
    </div>

    <!-- LEADERBOARD SCREEN -->
    <div id="leaderboard-screen" class="screen">
        <h1>🏆 Final Leaderboard 🏆</h1>
        <div id="podium" class="podium"></div>
        <ul id="final-leaderboard-list"></ul>
    </div>

    <canvas id="confetti-canvas"></canvas>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, remove, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // TODO: Replace with your actual Firebase config from Step 1
        const firebaseConfig = {
            apiKey: "AIzaSyDRg8ZJ4eFlHsbU-mvZGkeET49WZjbW4JQ",
            authDomain: "demogame-e8627.firebaseapp.com",
            databaseURL: "https://demogame-e8627-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "demogame-e8627",
            storageBucket: "demogame-e8627.firebasestorage.app",
            messagingSenderId: "251212598778",
            appId: "1:251212598778:web:8e12a0d06b6191fe6ae843"
        };

               const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // QR code points directly to the player page without any room codes.
        // Use a relative URL so it also works when opened via file:// during local testing.
        const playerUrl = new URL("player.html", window.location.href).href;
        new QRCode(document.getElementById("qrcode"), playerUrl);

        const questions = [
            { text: "What is 2 + 2?", answer: "4" },
            { text: "What color is a clear daytime sky?", answer: "blue" },
            { text: "What is the capital of France?", answer: "paris" }
        ];

        let currentRoundIndex = 0;
        let countdownInterval;

        // Global game database reference
        const gameRef = ref(db, `game`);
        
        // Reset/Initialize game state on load
        set(gameRef, {
            status: "waiting",
            round: 0,
            question: questions[0],
            players: {}
        });

        let audioCtx;

        function playUiTone(frequency, duration, type = "sine", volume = 0.05) {
            const AudioCtor = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtor) return;
            if (!audioCtx) audioCtx = new AudioCtor();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = type;
            oscillator.frequency.value = frequency;
            gainNode.gain.value = volume;

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
        }

        // Listen for players joining/updating
        const playersRef = ref(db, `game/players`);
        onValue(playersRef, (snapshot) => {
            const data = snapshot.val();
            const listEl = document.getElementById("player-list");
            const liveListEl = document.getElementById("live-player-list");
            listEl.innerHTML = "";
            liveListEl.innerHTML = "";
            
            if (data) {
                const players = Object.entries(data);
                players.forEach(([id, p]) => {
                    const li = document.createElement("li");
                    li.innerText = p.name;
                    listEl.appendChild(li);

                    const liveLi = document.createElement("li");
                    liveLi.innerText = `${p.name}: ${p.answered ? "✅ Answered" : "⏳ Thinking..."} (Total Score: ${p.score || 0})`;
                    liveListEl.appendChild(liveLi);
                });
                if (currentRoundIndex === 0) {
                    document.getElementById("start-btn").style.display = "inline-block";
                }
            }
        });

        window.startNextRound = function() {
            if (currentRoundIndex >= questions.length) {
                showLeaderboard();
                return;
            }

            get(playersRef).then((snapshot) => {
                if (snapshot.exists()) {
                    const updates = {};
                    snapshot.forEach((childSnap) => {
                        updates[`${childSnap.key}/answered`] = false;
                        updates[`${childSnap.key}/lastRoundPoints`] = 0;
                    });
                    update(playersRef, updates);
                }
            });

            document.getElementById("lobby-screen").classList.remove("active");
            document.getElementById("results-screen").classList.remove("active");
            document.getElementById("leaderboard-screen").classList.remove("active");
            document.getElementById("question-screen").classList.add("active");
            document.getElementById("round-indicator").innerText = `Round ${currentRoundIndex + 1} / 3`;
            document.getElementById("q-text").innerText = questions[currentRoundIndex].text;
            document.getElementById("action-btn").innerText = "End Round Early";
            document.getElementById("action-btn").onclick = endCurrentRound;
            playUiTone(440, 0.12, "triangle", 0.03);

            update(gameRef, {
                status: `round-${currentRoundIndex}`,
                round: currentRoundIndex,
                question: questions[currentRoundIndex],
                startTime: Date.now()
            });

            let timeLeft = 120;
            const timerEl = document.getElementById("timer");
            timerEl.innerText = timeLeft;
            clearInterval(countdownInterval);

            countdownInterval = setInterval(() => {
                timeLeft--;
                timerEl.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    endCurrentRound();
                }
            }, 1000);
        };

        function launchConfetti() {
            const canvas = document.getElementById("confetti-canvas");
            const ctx = canvas.getContext("2d");
            const particles = [];
            const colors = ["#6d5efc", "#2ec27e", "#f7b955", "#f05d5e", "#48c7ff", "#ff7ac6"];

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }

            resizeCanvas();
            window.addEventListener("resize", resizeCanvas, { once: true });

            for (let i = 0; i < 160; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height * 0.18,
                    r: Math.random() * 7 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    dx: (Math.random() - 0.5) * 10,
                    dy: (Math.random() * 4 + 4),
                    tilt: Math.random() * Math.PI,
                    tiltSpeed: (Math.random() - 0.5) * 0.25,
                    alpha: 1,
                    spin: Math.random() * 0.2 - 0.1
                });
            }

            const start = performance.now();
            function animate(now) {
                const elapsed = now - start;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                particles.forEach((p) => {
                    p.x += p.dx;
                    p.y += p.dy;
                    p.tilt += p.tiltSpeed;
                    p.alpha = Math.max(0, 1 - elapsed / 2400);

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.tilt);
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 1.5);
                    ctx.restore();
                });

                if (elapsed < 2200) {
                    requestAnimationFrame(animate);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }

            requestAnimationFrame(animate);
        }

        function showRoundResults() {
            clearInterval(countdownInterval);
            document.getElementById("question-screen").classList.remove("active");
            document.getElementById("leaderboard-screen").classList.remove("active");
            document.getElementById("results-screen").classList.add("active");
            launchConfetti();
            playUiTone(660, 0.14, "sine", 0.05);
            setTimeout(() => playUiTone(880, 0.18, "triangle", 0.05), 80);

            const resultsTitle = document.getElementById("round-results-title");
            const resultsButton = document.getElementById("results-next-btn");
            const resultsList = document.getElementById("round-results-list");
            resultsList.innerHTML = "";

            const isFinalRound = currentRoundIndex === questions.length - 1;
            resultsTitle.innerText = isFinalRound ? "Final Round Results" : `Round ${currentRoundIndex + 1} Results`;
            resultsButton.innerText = isFinalRound ? "Reveal Final Leaderboard" : `Start Round ${currentRoundIndex + 2}`;
            resultsButton.onclick = () => {
                if (isFinalRound) {
                    showLeaderboard();
                } else {
                    currentRoundIndex += 1;
                    startNextRound();
                }
            };

            get(playersRef).then((snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                const sortedPlayers = Object.values(data).sort((a, b) => (b.score || 0) - (a.score || 0));
                sortedPlayers.forEach((p, index) => {
                    const li = document.createElement("li");
                    li.className = `result-item${index === 0 ? " top-score" : ""}`;
                    const roundPoints = Number(p.lastRoundPoints || 0);
                    li.innerHTML = `<span>${p.name}</span><strong>+${roundPoints} pts</strong><span>Total: ${p.score || 0}</span>`;
                    resultsList.appendChild(li);
                });
            });
        }

        window.endCurrentRound = function() {
            clearInterval(countdownInterval);
            update(gameRef, { status: `round-${currentRoundIndex}-results` });
            showRoundResults();
        };

        window.advanceFromResults = function() {
            const isFinalRound = currentRoundIndex === questions.length - 1;
            if (isFinalRound) {
                showLeaderboard();
            } else {
                currentRoundIndex += 1;
                startNextRound();
            }
        };

        function showLeaderboard() {
            clearInterval(countdownInterval);
            document.getElementById("question-screen").classList.remove("active");
            document.getElementById("results-screen").classList.remove("active");
            document.getElementById("leaderboard-screen").classList.add("active");
            launchConfetti();
            playUiTone(740, 0.16, "sawtooth", 0.05);
            setTimeout(() => playUiTone(980, 0.2, "triangle", 0.05), 120);

            update(gameRef, { status: "leaderboard-reveal" });

            get(playersRef).then((snapshot) => {
                const data = snapshot.val();
                const lbList = document.getElementById("final-leaderboard-list");
                const podium = document.getElementById("podium");
                lbList.innerHTML = "";
                podium.innerHTML = "";

                if (data) {
                    const sortedPlayers = Object.values(data).sort((a, b) => (b.score || 0) - (a.score || 0));

                    const podiumPlayers = sortedPlayers.slice(0, 3);
                    podiumPlayers.forEach((p, index) => {
                        const item = document.createElement("div");
                        item.className = `podium-item rank-${index + 1}`;
                        const medal = ["🥇", "🥈", "🥉"][index];
                        item.innerHTML = `
                            <div class="podium-rank">${medal}</div>
                            <div class="podium-name">${p.name}</div>
                            <div class="podium-score">${p.score || 0} pts</div>
                        `;
                        podium.appendChild(item);
                    });

                    sortedPlayers.forEach((p, index) => {
                        const li = document.createElement("li");
                        li.className = "leaderboard-item";
                        const medal = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : "✨";
                        li.innerHTML = `${medal} #${index + 1}: ${p.name} — ${p.score || 0} pts`;
                        lbList.appendChild(li);
                    });
                }
            });
        }
    </script>
</body>
</html>
