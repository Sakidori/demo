<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game Host - Quiz Master</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg: #0b1020;
            --bg-2: #101a2d;
            --panel: rgba(18, 26, 42, 0.9);
            --panel-soft: rgba(24, 35, 55, 0.9);
            --panel-alt: rgba(31, 45, 69, 0.9);
            --primary: #7c5cff;
            --primary-2: #4ea1ff;
            --success: #2bd4a8;
            --success-2: #7af7d0;
            --danger: #ff5c7a;
            --text: #edf4ff;
            --muted: #aac0dd;
            --line: rgba(255,255,255,0.09);
            --shadow: 0 28px 60px rgba(8, 12, 22, 0.7);
        }

        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(124,92,255,0.2), transparent 30%),
                radial-gradient(circle at top right, rgba(78,161,255,0.18), transparent 28%),
                linear-gradient(135deg, var(--bg), var(--bg-2));
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(transparent 0%, rgba(255,255,255,0.02) 100%);
            pointer-events: none;
        }

        .screen {
            display: none;
            width: min(760px, 100%);
            background: linear-gradient(180deg, rgba(15, 22, 34, 0.94), rgba(17, 25, 40, 0.9));
            border: 1px solid var(--line);
            border-radius: 28px;
            box-shadow: var(--shadow);
            padding: 28px 20px 30px;
            animation: fadeInUp 0.45s ease;
            position: relative;
            z-index: 1;
        }

        .active { display: block; }

        h1, h2, h3 {
            margin-top: 0;
            color: var(--text);
        }

        h1 {
            font-size: clamp(2.2rem, 5vw, 3rem);
            margin-bottom: 18px;
            letter-spacing: -0.04em;
        }

        #qrcode {
            margin: 22px auto 24px;
            display: inline-block;
            background: rgba(255,255,255,0.96);
            padding: 14px;
            border-radius: 22px;
            box-shadow: 0 18px 35px rgba(124,92,255,0.25), inset 0 0 0 1px rgba(124,92,255,0.12);
            animation: float 3.2s ease-in-out infinite;
        }

        #lobby-screen {
            width: min(980px, 100%);
            padding: 32px;
        }

        .lobby-layout {
            display: grid;
            grid-template-columns: minmax(260px, 0.82fr) minmax(0, 1.18fr);
            gap: 30px;
            align-items: stretch;
        }

        .lobby-join {
            display: grid;
            align-content: center;
            justify-items: center;
            padding: 8px 30px 8px 8px;
            border-right: 1px solid var(--line);
        }

        .lobby-join h1 {
            font-size: 2.35rem;
            margin-bottom: 14px;
        }

        .lobby-join #qrcode {
            margin: 12px auto 0;
        }

        .lobby-roster {
            min-width: 0;
            padding: 12px 4px;
            text-align: left;
        }

        .roster-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .roster-heading h2 {
            margin: 0;
            font-size: 1.35rem;
        }

        #player-count {
            flex: 0 0 auto;
            color: var(--muted);
            font-size: 0.9rem;
        }

        #team-count { color: var(--muted); font-size: 0.85rem; }

        .lobby-roster ul {
            max-height: min(50vh, 360px);
            overflow-y: auto;
            padding-right: 6px;
        }

        .lobby-roster li {
            width: 100%;
            margin: 8px 0;
        }

        #empty-player-state {
            color: var(--muted);
            font-size: 0.95rem;
            text-align: center;
            padding: 28px 12px;
        }

        .lobby-actions {
            margin-top: 22px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 10px 0 0;
        }

        li {
            font-size: 18px;
            background: linear-gradient(180deg, rgba(21, 31, 50, 0.95), rgba(18, 28, 44, 0.85));
            color: var(--text);
            padding: 12px 18px;
            width: min(360px, 85%);
            margin: 8px auto;
            border-radius: 14px;
            box-shadow: 0 10px 20px rgba(4,10,20,0.35);
            border: 1px solid var(--line);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            animation: slideIn 0.25s ease both;
        }

        .player-line {
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
        }

        .avatar-chip {
            display: inline-grid;
            place-items: center;
            flex: 0 0 34px;
            width: 34px;
            height: 34px;
            border: 1px solid var(--line);
            border-radius: 11px;
            background: rgba(255,255,255,0.06);
            font-size: 1.25rem;
        }

        .player-name {
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .player-status {
            margin-left: auto;
            color: var(--muted);
            font-size: 0.85rem;
            text-align: right;
        }

        li:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 22px rgba(4,10,20,0.42);
            border-color: rgba(124,92,255,0.4);
        }

        button {
            font-size: 20px;
            padding: 14px 26px;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            margin-top: 18px;
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: white;
            box-shadow: 0 18px 32px rgba(124,92,255,0.34);
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
            letter-spacing: 0.01em;
            position: relative;
            overflow: hidden;
        }

        button::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.28) 45%, transparent 100%);
            transform: translateX(-140%);
            transition: transform 0.7s ease;
        }

        button:hover::after {
            transform: translateX(140%);
        }

        button:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 22px 30px rgba(124,92,255,0.4);
            filter: brightness(1.04);
        }

        #action-btn {
            background: linear-gradient(135deg, var(--danger), #ff7a59);
            box-shadow: 0 18px 28px rgba(255,92,122,0.28);
        }

        .results-badge {
            display: inline-block;
            padding: 8px 18px;
            background: rgba(124,92,255,0.12);
            border: 1px solid rgba(124,92,255,0.26);
            color: #d9d0ff;
            border-radius: 999px;
            font-weight: 700;
            margin-bottom: 10px;
            animation: pulse 1.8s infinite;
        }

        #round-results-list {
            margin-top: 18px;
        }

        .result-item {
            display: grid;
            grid-template-columns: 42px 32px minmax(0, 1fr) auto;
            gap: 14px;
            align-items: center;
            width: min(500px, 92%);
            padding: 14px 18px;
            font-size: 18px;
            background: linear-gradient(180deg, rgba(26, 37, 58, 0.96), rgba(19, 28, 42, 0.96));
            border-radius: 16px;
            margin: 10px auto;
            box-shadow: 0 12px 18px rgba(3, 8, 18, 0.32);
            border: 1px solid var(--line);
            transition: transform 650ms cubic-bezier(0.2, 0.8, 0.2, 1), border-color 250ms ease, box-shadow 250ms ease;
            will-change: transform;
        }

        .result-rank {
            color: var(--muted);
            font-size: 1rem;
            font-weight: 800;
            text-align: left;
        }

        .result-player {
            min-width: 0;
            text-align: left;
        }

        .result-avatar {
            position: relative;
            display: inline-grid;
            place-items: center;
            font-size: 1.5rem;
            width: 32px;
            height: 32px;
        }

        .result-name {
            overflow-wrap: anywhere;
        }

        .result-total {
            display: block;
            margin-top: 4px;
            color: var(--muted);
            font-size: 0.78rem;
        }

        .result-item strong {
            color: var(--success-2);
            white-space: nowrap;
        }

        .result-item.rank-up {
            border-color: rgba(43,212,168,0.55);
            box-shadow: 0 0 24px rgba(43,212,168,0.14), 0 12px 18px rgba(3,8,18,0.32);
        }

        .result-item.rank-down {
            border-color: rgba(255,185,71,0.4);
        }

        @media (prefers-reduced-motion: reduce) {
            .result-item { transition-duration: 1ms; }
        }

        .result-item.top-score {
            background: linear-gradient(180deg, rgba(38, 29, 18, 0.95), rgba(29, 24, 15, 0.98));
            border: 1px solid rgba(255,185,71,0.3);
        }

        .leaderboard-item {
            font-size: 22px;
            font-weight: bold;
            background: linear-gradient(135deg, #1d2740, #2a3d66);
            color: #edf4ff;
            border: 1px solid rgba(124,92,255,0.3);
            box-shadow: 0 14px 22px rgba(10,14,23,0.4);
            animation: riseIn 0.55s ease both;
        }

        .podium {
            display: grid;
            grid-template-columns: repeat(3, minmax(120px, 1fr));
            gap: 14px;
            width: min(520px, 100%);
            margin: 20px auto 8px;
            align-items: end;
        }

        .podium-item {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px 20px 14px 14px;
            padding: 12px 8px 10px;
            box-shadow: 0 16px 26px rgba(0,0,0,0.22);
            animation: riseIn 0.6s ease both;
        }

        .podium-item.rank-1 {
            background: linear-gradient(180deg, rgba(255,205,84,0.2), rgba(255,176,38,0.12));
            height: 160px;
        }

        .podium-item.rank-2 {
            background: linear-gradient(180deg, rgba(124,92,255,0.18), rgba(78,161,255,0.12));
            height: 130px;
        }

        .podium-item.rank-3 {
            background: linear-gradient(180deg, rgba(255,126,93,0.12), rgba(255,92,122,0.1));
            height: 110px;
        }

        .podium-rank {
            font-size: 1.7rem;
            font-weight: 800;
        }

        .podium-name {
            font-weight: 700;
            margin: 6px 0 2px;
        }

        .podium-score {
            font-size: 0.95rem;
            color: var(--muted);
        }

        #timer {
            color: #9deed0;
            font-weight: 700;
        }

        .task-heading {
            color: var(--muted);
            margin-bottom: 8px;
        }

        .task-bomb {
            display: block;
            font-size: 5rem;
            line-height: 1;
            margin: 12px auto 20px;
            animation: bombPulse 1s ease-in-out infinite;
            filter: drop-shadow(0 0 18px rgba(255,92,122,0.45));
        }

        #task-prompt {
            width: min(680px, 100%);
            margin: 0 auto 22px;
            font-size: clamp(1.6rem, 4vw, 2.6rem);
        }

        .active-player-banner {
            width: fit-content;
            max-width: 100%;
            margin: 0 auto 16px;
            padding: 10px 16px;
            border: 1px solid rgba(255,92,122,0.35);
            border-radius: 12px;
            background: rgba(255,92,122,0.1);
            color: #ffd4dc;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .active-player-banner span { margin-right: 8px; }

        .team-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text);
            font-size: 0.85rem;
            font-weight: 700;
        }

        .team-chip::before {
            content: "";
            display: inline-block;
            width: 13px;
            height: 13px;
            border: 1px solid rgba(255,255,255,0.65);
            border-radius: 50%;
            background: var(--team-color, #64748b);
            box-shadow: 0 0 12px color-mix(in srgb, var(--team-color, #64748b) 60%, transparent);
        }

        #lost-team-chip { font-size: 1.2rem; margin: 14px 0; }

        .result-team-player { border-left: 5px solid var(--team-color, #64748b); }

        @keyframes bombPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.13); }
        }

        .question-image-wrap {
            width: min(100%, 720px);
            margin: 12px auto 18px;
            padding: 8px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: rgba(255,255,255,0.04);
        }

        .question-image-wrap[hidden] { display: none; }

        .question-image {
            display: block;
            width: 100%;
            max-height: 42vh;
            object-fit: contain;
            border-radius: 8px;
        }

        .music-control {
            position: fixed;
            top: 14px;
            right: 16px;
            z-index: 10;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            width: auto;
            margin: 0;
            padding: 9px 13px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: rgba(18,26,42,0.94);
            color: var(--text);
            box-shadow: 0 10px 24px rgba(0,0,0,0.28);
            font-size: 0.9rem;
        }

        .music-control[aria-pressed="true"] {
            border-color: rgba(43,212,168,0.55);
            color: var(--success-2);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-8px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.04); opacity: 0.88; }
        }

        @keyframes riseIn {
            from { opacity: 0; transform: translateY(18px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (max-width: 600px) {
            body { padding: 56px 12px 20px; }
            .music-control { top: 8px; right: 8px; padding: 8px 10px; font-size: 0.8rem; }
            .screen { padding: 22px 14px 24px; border-radius: 18px; }
            #lobby-screen { padding: 22px 16px; }
            .lobby-layout { grid-template-columns: minmax(0, 1fr); gap: 14px; }
            .lobby-join { padding: 0 0 18px; border-right: 0; border-bottom: 1px solid var(--line); }
            .lobby-join h1 { width: 100%; font-size: clamp(1.6rem, 7vw, 2rem); margin-bottom: 8px; }
            .lobby-join #qrcode { margin-top: 8px; }
            .lobby-join #qrcode canvas,
            .lobby-join #qrcode img { width: min(48vw, 180px); height: min(48vw, 180px); }
            .lobby-roster { padding: 8px 0 0; }
            .lobby-roster ul { max-height: 220px; }
            .lobby-roster #empty-player-state { margin: 8px 0; padding: 14px 10px; }
            .lobby-actions { margin-top: 14px; }
            .question-image-wrap { padding: 5px; margin: 8px auto 12px; }
            .question-image { max-height: 34vh; }
            li { width: 92%; }
            .result-item { width: 96%; grid-template-columns: 30px 26px minmax(0, 1fr) auto; gap: 8px; padding: 12px 10px; font-size: 15px; }
            .result-item strong { font-size: 0.88rem; }
            .podium { grid-template-columns: repeat(3, minmax(90px, 1fr)); }
            button { width: 100%; }
        }
    </style>
</head>
<body>

    <button id="music-toggle" class="music-control" type="button" aria-pressed="false" aria-label="Turn music on">
        <span aria-hidden="true">♫</span><span id="music-label">Music off</span>
    </button>

    <!-- LOBBY SCREEN -->
    <div id="lobby-screen" class="screen active">
        <div class="lobby-layout">
            <section class="lobby-join" aria-label="Join the game">
                <h1>Scan to Join Game</h1>
                <div id="qrcode"></div>
            </section>
            <section class="lobby-roster" aria-labelledby="lobby-roster-title">
                <div class="roster-heading">
                    <h2 id="lobby-roster-title">Players in Lobby</h2>
                    <span><span id="player-count">0 joined</span> · <span id="team-count">0 teams</span></span>
                </div>
                <ul id="player-list"></ul>
                <p id="empty-player-state">Waiting for players to join</p>
            </section>
        </div>
        <div class="lobby-actions">
            <button id="start-btn" style="display:none;" onclick="startNextRound()">Start Bomb Round</button>
        </div>
    </div>

    <!-- TASK PASSING SCREEN -->
    <div id="task-screen" class="screen">
        <div class="status-chip">Bomb Round</div>
        <h2>Pass the Bomb</h2>
        <span class="task-bomb" aria-label="Bomb">💣</span>
        <div id="active-player-banner" class="active-player-banner"><span aria-hidden="true">💣</span><strong id="active-player-name">Choosing player...</strong> has the bomb · <span id="active-player-team" class="team-chip"></span></div>
        <h1 id="task-prompt">Get ready...</h1>
        <h3>Time Remaining: <span id="task-timer">120</span>s</h3>
        <ul id="task-player-list" aria-label="Players in the task round"></ul>
        <p id="bomb-lock-status" class="status-chip">Bomb Locked</p>
        <button id="unlock-bomb-btn" onclick="unlockBomb()">Release Bomb Lock</button>
    </div>

    <!-- BOMB RESULT SCREEN -->
    <div id="bomb-result-screen" class="screen">
        <div class="results-badge">Bomb Exploded</div>
        <h1 id="lost-team-title">Team lost</h1>
        <div id="lost-team-chip" class="team-chip"></div>
        <p id="lost-player-name"></p>
        <ul id="lost-team-players"></ul>
        <button onclick="resetGame()">Back to Lobby</button>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { createFunkyMusic } from "./music.js";
        import { TEAM_COLORS, TONGUE_TWISTERS } from "./game-data.js";

        // TODO: Replace with your actual Firebase config from Step 1
        const firebaseConfig = {
            apiKey: "AIzaSyDRg8ZJ4eFlHsbU-mvZGkeET49WZjbW4JQ",
            authDomain: "demogame-e8627.firebaseapp.com",
            databaseURL: "https://demogame-e8627-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "demogame-e8627",
            storageBucket: "demogame-e8627.firebasestorage.app",
            messagingSenderId: "251212598778",
            appId: "1:251212598778:web:8e12a0d06b6191fe6ae843"
        };

               const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // QR code points directly to the player page without any room codes.
        // Use a relative URL so it also works when opened via file:// during local testing.
        const playerUrl = new URL("player.html", window.location.href).href;
        new QRCode(document.getElementById("qrcode"), playerUrl);

        const questions = [
            { text: "Solve the crossword.", image: "crossword.webp", imageAlt: "Crossword puzzle with a question-mark clue and intersecting entries", answer: "question mark" },
            { text: "What color is a clear daytime sky?", answer: "blue" },
            { text: "What is the capital of France?", answer: "paris" }
        ];
        const playerAvatars = new Set(["🦊", "🐼", "🐸", "🐯", "🐙", "🦉", "🐧", "🦄", "🐨", "🦁", "🐵", "🐢", "🐺", "🐰", "🐻", "🐬", "🐳", "🦖"]);
        const getPlayerAvatar = (player) => playerAvatars.has(player.avatar) ? player.avatar : "🎮";

        let currentRoundIndex = 0;
        let countdownInterval;
        let activePlayerId = "";
        let previousActivePlayerId = "";
        let currentTask = "";
        let fuseStartedAt = 0;
        let currentPhase = "waiting";
        let bombLocked = true;
        let hostPlayers = {};
        const getTeam = (teamId) => TEAM_COLORS.find((team) => team.id === teamId);

        // Global game database reference
        const gameRef = ref(db, `game`);
        
        // Reset/Initialize game state on load
        set(gameRef, {
            status: "waiting",
            phase: "waiting",
            round: 1,
            players: {}
        });

        let audioCtx;
        const funkyMusic = createFunkyMusic();
        const musicToggle = document.getElementById("music-toggle");
        const musicLabel = document.getElementById("music-label");

        musicToggle.addEventListener("click", async () => {
            if (funkyMusic.isPlaying) {
                funkyMusic.stop();
            } else {
                try {
                    await funkyMusic.start();
                } catch (error) {
                    musicLabel.innerText = "Audio unavailable";
                    return;
                }
            }

            musicToggle.setAttribute("aria-pressed", String(funkyMusic.isPlaying));
            musicToggle.setAttribute("aria-label", funkyMusic.isPlaying ? "Turn music off" : "Turn music on");
            musicLabel.innerText = funkyMusic.isPlaying ? "Music on" : "Music off";
        });

        function playUiTone(frequency, duration, type = "sine", volume = 0.05) {
            const AudioCtor = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtor) return;
            if (!audioCtx) audioCtx = new AudioCtor();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = type;
            oscillator.frequency.value = frequency;
            gainNode.gain.value = volume;

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
        }

        function renderQuestion(question) {
            document.getElementById("q-text").innerText = question.text;
            const imageWrap = document.getElementById("question-image-wrap");
            const image = document.getElementById("question-image");
            imageWrap.hidden = !question.image;
            if (question.image) {
                image.src = question.image;
                image.alt = question.imageAlt || question.text;
            } else {
                image.removeAttribute("src");
                image.alt = "";
            }
        }

        function renderHostPlayerLists(data) {
            const listEl = document.getElementById("player-list");
            const taskListEl = document.getElementById("task-player-list");
            const countEl = document.getElementById("player-count");
            const teamCountEl = document.getElementById("team-count");
            const emptyStateEl = document.getElementById("empty-player-state");
            const startButton = document.getElementById("start-btn");
            listEl.innerHTML = "";
            taskListEl.innerHTML = "";

            const players = Object.entries(data || {}).filter(([, player]) =>
                player && typeof player.name === "string" && player.name.trim()
            );
            const teams = new Set(players.map(([, player]) => player.teamId).filter(Boolean));
            countEl.innerText = `${players.length} joined`;
            teamCountEl.innerText = `${teams.size} teams`;
            emptyStateEl.hidden = players.length > 0 && teams.size >= 2;
            emptyStateEl.innerText = players.length ? "Two teams are needed to start" : "Waiting for players to join";
            startButton.style.display = teams.size >= 2 && currentPhase === "waiting" ? "inline-block" : "none";

            players.forEach(([id, player]) => {
                const team = getTeam(player.teamId);
                const li = document.createElement("li");
                li.classList.add("player-line");
                li.style.setProperty("--team-color", team?.hex || "#64748b");
                const avatar = document.createElement("span");
                avatar.className = "avatar-chip";
                avatar.innerText = getPlayerAvatar(player);
                const name = document.createElement("span");
                name.className = "player-name";
                name.innerText = player.name;
                const teamLabel = document.createElement("span");
                teamLabel.className = "team-chip player-status";
                teamLabel.innerText = team?.name || "No team";
                li.append(avatar, name, teamLabel);
                listEl.appendChild(li);

                const statusRow = document.createElement("li");
                statusRow.classList.add("player-line");
                statusRow.style.setProperty("--team-color", team?.hex || "#64748b");
                const statusAvatar = document.createElement("span");
                statusAvatar.className = "avatar-chip";
                statusAvatar.innerText = getPlayerAvatar(player);
                const statusName = document.createElement("span");
                statusName.className = "player-name";
                statusName.innerText = player.name;
                const status = document.createElement("span");
                status.className = "player-status";
                status.innerText = currentPhase === "bomb" && id === activePlayerId ? "💣 Has bomb" : team?.name || "No team";
                statusRow.append(statusAvatar, statusName, status);
                if (currentPhase === "bomb" && id === activePlayerId) statusRow.classList.add("result-team-player");
                taskListEl.appendChild(statusRow);
            });
        }

        // Listen for players joining/updating
        const playersRef = ref(db, `game/players`);
        onValue(playersRef, (snapshot) => {
            hostPlayers = snapshot.val() || {};
            renderHostPlayerLists(hostPlayers);
        });

        onValue(gameRef, (snapshot) => {
            const gameData = snapshot.val();
            if (!gameData || gameData.phase !== "bomb" || currentPhase !== "bomb") return;
            activePlayerId = gameData.activePlayerId || activePlayerId;
            currentTask = gameData.task || currentTask;
            bombLocked = gameData.bombLocked !== false;
            hostPlayers = gameData.players || hostPlayers;
            renderActivePlayer();
            renderHostPlayerLists(hostPlayers);
            renderBombLockState();
        });

        window.startNextRound = async function() {
            if (currentPhase !== "waiting") return;
            const snapshot = await get(playersRef);
            const players = Object.entries(snapshot.val() || {}).filter(([, player]) => player?.name && player.teamId);
            if (new Set(players.map(([, player]) => player.teamId)).size < 2) return;
            hostPlayers = snapshot.val() || {};
            activePlayerId = players[Math.floor(Math.random() * players.length)][0];
            currentTask = TONGUE_TWISTERS[Math.floor(Math.random() * TONGUE_TWISTERS.length)];
            currentPhase = "bomb";
            bombLocked = true;
            fuseStartedAt = Date.now();
            document.getElementById("lobby-screen").classList.remove("active");
            document.getElementById("bomb-result-screen").classList.remove("active");
            document.getElementById("task-screen").classList.add("active");
            renderActivePlayer();
            renderHostPlayerLists(hostPlayers);
            renderBombLockState();
            playUiTone(440, 0.12, "triangle", 0.03);

            await update(gameRef, { status: "bomb-round", phase: "bomb", round: 1, task: currentTask, activePlayerId, bombLocked });
            updateHostFuse();
            clearInterval(countdownInterval);
            countdownInterval = setInterval(updateHostFuse, 250);
        };

        window.unlockBomb = async function() {
            if (currentPhase !== "bomb" || !bombLocked) return;
            bombLocked = false;
            renderBombLockState();
            await update(gameRef, { bombLocked: false });
        };

        function renderBombLockState() {
            const status = document.getElementById("bomb-lock-status");
            const button = document.getElementById("unlock-bomb-btn");
            status.innerText = bombLocked ? "Bomb Locked" : "Bomb Unlocked · Waiting for Player";
            button.innerText = bombLocked ? "Release Bomb Lock" : "Waiting for Player to Pass";
            button.disabled = currentPhase !== "bomb" || !bombLocked;
        }

        window.endTaskRound = function() {
            explodeBomb();
        };

        function renderActivePlayer() {
            const player = hostPlayers[activePlayerId];
            const team = getTeam(player?.teamId);
            document.getElementById("active-player-name").innerText = player?.name || "A player";
            const teamEl = document.getElementById("active-player-team");
            teamEl.innerText = team ? `Team ${team.name}` : "Unknown team";
            teamEl.style.setProperty("--team-color", team?.hex || "#64748b");
            document.getElementById("task-prompt").innerText = currentTask;
        }

        function updateHostFuse() {
            if (currentPhase !== "bomb") return;
            const timeLeft = Math.max(0, 120 - Math.floor((Date.now() - fuseStartedAt) / 1000));
            document.getElementById("task-timer").innerText = timeLeft;
            if (timeLeft <= 0) explodeBomb();
        }

        async function explodeBomb() {
            if (currentPhase !== "bomb") return;
            currentPhase = "exploding";
            clearInterval(countdownInterval);
            const snapshot = await get(playersRef);
            hostPlayers = snapshot.val() || hostPlayers;
            const losingPlayer = hostPlayers[activePlayerId];
            const losingTeam = getTeam(losingPlayer?.teamId);
            const losingPlayers = Object.values(hostPlayers).filter((player) => player?.teamId === losingPlayer?.teamId);
            document.getElementById("task-screen").classList.remove("active");
            document.getElementById("bomb-result-screen").classList.add("active");
            document.getElementById("lost-team-title").innerText = `${losingTeam?.name || "Unknown"} Team Lost`;
            document.getElementById("lost-team-chip").innerText = `Team ${losingTeam?.name || "Unknown"}`;
            document.getElementById("lost-team-chip").style.setProperty("--team-color", losingTeam?.hex || "#64748b");
            document.getElementById("lost-player-name").innerText = `Bomb holder: ${losingPlayer?.name || "Unknown player"}`;
            const membersList = document.getElementById("lost-team-players");
            membersList.innerHTML = "";
            losingPlayers.forEach((player) => {
                const row = document.createElement("li");
                row.className = "player-line result-team-player";
                row.style.setProperty("--team-color", losingTeam?.hex || "#64748b");
                row.innerText = `${getPlayerAvatar(player)} ${player.name}`;
                membersList.appendChild(row);
            });
            await update(gameRef, {
                status: "bomb-exploded",
                phase: "finished",
                losingTeamId: losingPlayer?.teamId || "",
                losingTeamName: losingTeam?.name || "Unknown",
                losingTeamColor: losingTeam?.hex || "#64748b",
                losingPlayerId: activePlayerId,
                losingPlayerName: losingPlayer?.name || "Unknown player"
            });
            currentPhase = "finished";
            renderHostPlayerLists(hostPlayers);
        };

        window.resetGame = async function() {
            clearInterval(countdownInterval);
            activePlayerId = "";
            previousActivePlayerId = "";
            currentTask = "";
            currentPhase = "waiting";
            bombLocked = true;
            await set(gameRef, { status: "waiting", phase: "waiting", round: 0, players: {} });
            document.getElementById("task-screen").classList.remove("active");
            document.getElementById("bomb-result-screen").classList.remove("active");
            document.getElementById("lobby-screen").classList.add("active");
            renderHostPlayerLists({});
        };

        function showRoundResults() {
            clearInterval(countdownInterval);
            document.getElementById("question-screen").classList.remove("active");
            document.getElementById("leaderboard-screen").classList.remove("active");
            document.getElementById("results-screen").classList.add("active");
            playUiTone(660, 0.14, "sine", 0.05);
            setTimeout(() => playUiTone(880, 0.18, "triangle", 0.05), 80);

            const resultsTitle = document.getElementById("round-results-title");
            const resultsButton = document.getElementById("results-next-btn");
            const resultsList = document.getElementById("round-results-list");
            resultsList.innerHTML = "";

            const isFinalRound = currentRoundIndex === questions.length - 1;
            resultsTitle.innerText = isFinalRound ? "Final Round Results" : `Round ${currentRoundIndex + 1} Results`;
            resultsButton.innerText = isFinalRound ? "Reveal Final Leaderboard" : `Start Round ${currentRoundIndex + 2}`;
            resultsButton.onclick = () => {
                if (isFinalRound) {
                    showLeaderboard();
                } else {
                    currentRoundIndex += 1;
                    startNextRound();
                }
            };

            get(playersRef).then((snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                const players = Object.entries(data)
                    .filter(([, player]) => player && typeof player.name === "string" && player.name.trim())
                    .map(([id, player]) => {
                    const score = Number(player.score || 0);
                    const roundPoints = Number(player.lastRoundPoints || 0);
                        return { id, name: player.name, avatar: getPlayerAvatar(player), score, roundPoints, previousScore: Math.max(0, score - roundPoints) };
                    });
                const previousStandings = [...players].sort((a, b) => b.previousScore - a.previousScore);
                const previousRanks = new Map(previousStandings.map((player, index) => [player.id, index + 1]));

                previousStandings.forEach((player, index) => {
                    const li = document.createElement("li");
                    li.className = "result-item";
                    li.dataset.playerId = player.id;
                    li.innerHTML = `<span class="result-rank">#${index + 1}</span><span class="result-avatar" aria-hidden="true"></span><span class="result-player"><span class="result-name"></span><span class="result-total">Total: <span class="total-count">${player.previousScore}</span></span></span><strong>+<span class="round-count">0</span> pts</strong>`;
                    li.querySelector(".result-avatar").innerText = player.avatar;
                    li.querySelector(".result-name").textContent = player.name;
                    resultsList.appendChild(li);
                });

                const duration = 1050;
                const updateCount = (element, start, end, startTime) => {
                    const difference = end - start;
                    return new Promise((resolve) => {
                        const tick = () => {
                            const progress = Math.max(0, Math.min((performance.now() - startTime) / duration, 1));
                            const eased = 1 - Math.pow(1 - progress, 4);
                            element.textContent = Math.round(start + difference * eased).toLocaleString();
                            if (progress < 1) {
                                window.setTimeout(tick, 32);
                            } else {
                                resolve();
                            }
                        };
                        tick();
                    });
                };

                const revealStart = performance.now() + 120;
                const countAnimations = previousStandings.flatMap((player) => {
                    const row = resultsList.querySelector(`[data-player-id="${player.id}"]`);
                    return [
                        updateCount(row.querySelector(".round-count"), 0, player.roundPoints, revealStart),
                        updateCount(row.querySelector(".total-count"), player.previousScore, player.score, revealStart)
                    ];
                });

                Promise.all(countAnimations).then(() => {
                    const positions = new Map(Array.from(resultsList.children, (row) => [row.dataset.playerId, row.getBoundingClientRect().top]));
                    const finalStandings = [...players].sort((a, b) => b.score - a.score);

                    finalStandings.forEach((player, index) => {
                        const row = resultsList.querySelector(`[data-player-id="${player.id}"]`);
                        const oldRank = previousRanks.get(player.id);
                        row.querySelector(".result-rank").textContent = `#${index + 1}`;
                        row.classList.toggle("top-score", index === 0);
                        if (oldRank !== index + 1) {
                            row.classList.add(index + 1 < oldRank ? "rank-up" : "rank-down");
                        }
                        resultsList.appendChild(row);
                    });

                    Array.from(resultsList.children).forEach((row) => {
                        const offset = positions.get(row.dataset.playerId) - row.getBoundingClientRect().top;
                        row.style.transform = `translateY(${offset}px)`;
                    });
                    window.setTimeout(() => {
                        Array.from(resultsList.children).forEach((row) => { row.style.transform = ""; });
                    }, 32);
                });
            });
        }

        window.endCurrentRound = function() {
            if (currentPhase !== "quiz") return;
            clearInterval(countdownInterval);
            currentPhase = "results";
            update(gameRef, { status: `round-${currentRoundIndex}-results`, phase: "results" });
            showRoundResults();
        };

        window.advanceFromResults = function() {
            const isFinalRound = currentRoundIndex === questions.length - 1;
            if (isFinalRound) {
                showLeaderboard();
            } else {
                currentRoundIndex += 1;
                startNextRound();
            }
        };

        function showLeaderboard() {
            clearInterval(countdownInterval);
            document.getElementById("question-screen").classList.remove("active");
            document.getElementById("results-screen").classList.remove("active");
            document.getElementById("leaderboard-screen").classList.add("active");
            playUiTone(740, 0.16, "sawtooth", 0.05);
            setTimeout(() => playUiTone(980, 0.2, "triangle", 0.05), 120);

            update(gameRef, { status: "leaderboard-reveal" });

            get(playersRef).then((snapshot) => {
                const data = snapshot.val();
                const lbList = document.getElementById("final-leaderboard-list");
                const podium = document.getElementById("podium");
                lbList.innerHTML = "";
                podium.innerHTML = "";

                if (data) {
                    const sortedPlayers = Object.values(data)
                        .filter((player) => player && typeof player.name === "string" && player.name.trim())
                        .sort((a, b) => (b.score || 0) - (a.score || 0));

                    const podiumPlayers = sortedPlayers.slice(0, 3);
                    podiumPlayers.forEach((p, index) => {
                        const item = document.createElement("div");
                        item.className = `podium-item rank-${index + 1}`;
                        const medal = ["🥇", "🥈", "🥉"][index];
                        const rank = document.createElement("div");
                        rank.className = "podium-rank";
                        rank.innerText = medal;
                        const avatar = document.createElement("span");
                        avatar.className = "result-avatar";
                        avatar.setAttribute("aria-hidden", "true");
                        avatar.innerText = getPlayerAvatar(p);
                        const name = document.createElement("div");
                        name.className = "podium-name";
                        name.innerText = p.name;
                        const score = document.createElement("div");
                        score.className = "podium-score";
                        score.innerText = `${p.score || 0} pts`;
                        item.append(rank, avatar, name, score);
                        podium.appendChild(item);
                    });

                    sortedPlayers.forEach((p, index) => {
                        const li = document.createElement("li");
                        li.className = "leaderboard-item";
                        const medal = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : "✨";
                        li.classList.add("player-line");
                        const avatar = document.createElement("span");
                        avatar.className = "avatar-chip";
                        avatar.innerText = getPlayerAvatar(p);
                        const name = document.createElement("span");
                        name.className = "player-name";
                        name.innerText = `${medal} #${index + 1}: ${p.name}`;
                        const score = document.createElement("span");
                        score.className = "player-status";
                        score.innerText = `${p.score || 0} pts`;
                        li.append(avatar, name, score);
                        lbList.appendChild(li);
                    });
                }
            });
        }
    </script>
</body>
</html>
